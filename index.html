<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebHAR – Live HAR Dashboard (WASM + Watchdog)</title>

  <!-- Plotly -->
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <!-- ONNXRuntime-Web -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body { background:#f5f7fa; font-family:"Inter",sans-serif; padding:1.5rem; }
    .prediction-card,.console-card {
      background:#fff;border-radius:.75rem;box-shadow:0 2px 8px rgba(0,0,0,0.1);padding:1rem;text-align:center;
    }
    .prediction-card{background:#eef7ff;color:#007bff;font-weight:700;font-size:1.5rem;height:9rem;overflow:hidden;padding:.75rem 1rem;}
    .prediction-card div{white-space:nowrap;}
    #predHistory{display:flex;justify-content:center;gap:.4rem;margin-top:.5rem;padding-top:.5rem;border-top:1px solid rgba(0,123,255,.15);}
    #predHistory .slot{width:2.6rem;height:2.6rem;display:flex;align-items:center;justify-content:center;font-size:1.4rem;border-radius:.5rem;background:rgba(0,123,255,.06);opacity:.55;}
    #predHistory .slot.current{opacity:1;background:rgba(0,123,255,.15);outline:2px solid rgba(0,123,255,.4);}
    #predLabel{font-size:1.4rem;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;}
    #predEmoji{font-size:2rem;vertical-align:middle;}
    .plot-container{background:white;border-radius:.75rem;padding:1rem;box-shadow:0 2px 8px rgba(0,0,0,0.1);margin-top:1rem;}
    .small-text{font-size:.9rem;color:#555;}
    #consoleBox{
      background:#111;color:#0f0;font-family:monospace;font-size:.9rem;
      text-align:left;overflow-y:auto;max-height:260px;padding:.5rem;border-radius:.5rem;
      white-space:pre-wrap; word-wrap:break-word;
    }
    :root { --axis-x:#f4a3a8; --axis-y:#a8d8b9; --axis-z:#a7c7e7; }
    .axis-x,.axis-y,.axis-z{color:#333;border-radius:.35rem;padding:0 .35rem;}
    .axis-x{background:var(--axis-x);} .axis-y{background:var(--axis-y);} .axis-z{background:var(--axis-z);}
    .plot-container h5{margin-bottom:.25rem;}
    .raw-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.25rem 1rem;border-top:1px solid #eee;padding-top:.5rem;}
    #modelSelect.model-ok{background-color:rgba(25,135,84,.18);border-color:rgba(25,135,84,.5);}
    #modelSelect.model-error{background-color:rgba(220,53,69,.18);border-color:rgba(220,53,69,.5);}
  </style>
</head>

<body>
  <div class="container">
    <h1>📱 WebHAR – Real-Time HAR Dashboard</h1>

    <div class="d-flex flex-nowrap align-items-center gap-2 mb-3">
      <button id="toggleButton" class="btn btn-success" style="min-width:5rem">Start</button>
      <select id="modelSelect" class="form-select w-auto" style="min-width:0" title="not loaded">
        <!-- Filled at runtime; falls back to cnnpf_loo_ms_erm.onnx -->
      </select>
      <button class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#optionsModal" title="Options">⚙️</button>
      <button id="exportBtn" class="btn btn-outline-secondary" title="Export predictions (CSV)" disabled>📥</button>
    </div>

    <!-- Options modal: values are only committed to `config` on Apply -->
    <div class="modal fade" id="optionsModal" tabindex="-1" aria-labelledby="optionsTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="optionsTitle">⚙️ Options</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body d-grid gap-3">
            <div class="input-group">
              <span class="input-group-text">Rate (Hz)</span>
              <input id="rateSelect" type="number" min="1" max="100" value="20" class="form-control" />
            </div>
            <div class="input-group">
              <span class="input-group-text">Gyro</span>
              <select id="gyroUnit" class="form-select"><option value="rads" selected>rad/s</option><option value="degs">°/s</option></select>
            </div>
            <div class="input-group">
              <span class="input-group-text">Accel</span>
              <select id="accType" class="form-select"><option value="linear" selected>Linear</option><option value="gravity">Incl. Gravity</option></select>
            </div>
            <div class="input-group">
              <span class="input-group-text">Countdown</span>
              <select id="countdownSelect" class="form-select"><option value="0" selected>Disabled</option><option value="3">3 s</option><option value="5">5 s</option><option value="10">10 s</option></select>
            </div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="debugMode"><label class="form-check-label" for="debugMode">Debug Data</label></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" id="applyOptions" class="btn btn-primary">Apply</button>
          </div>
        </div>
      </div>
    </div>

    <div class="prediction-card">
      <div class="d-flex align-items-center justify-content-between gap-2">
        <div id="predLabel">
          <span id="predEmoji">–</span>
          <span id="predActivity">–</span>
        </div>
        <div class="small-text fw-normal text-end">
          <span id="predTime">–</span> (<span id="predLatency">–</span>)
          <div id="loopStatus">Loop: idle</div>
        </div>
      </div>
      <!-- Last HISTORY_LEN predictions, oldest left, current rightmost -->
      <div id="predHistory"></div>
    </div>

    <div class="plot-container">
      <h5>Accelerometer (<span id="accUnit">m/s²</span>)</h5><div id="accPlot"></div>
      <div class="raw-row small-text">
        <span><span class="axis-x">X: <b id="ax">0</b></span> &nbsp; <span class="axis-y">Y: <b id="ay">0</b></span> &nbsp; <span class="axis-z">Z: <b id="az">0</b></span></span>
        <span id="accStats" class="text-end"></span>
      </div>
    </div>
    <div class="plot-container">
      <h5>Gyroscope (<span id="gyroUnitLabel">rad/s</span>)</h5><div id="gyroPlot"></div>
      <div class="raw-row small-text">
        <span><span class="axis-x">X: <b id="gx">0</b></span> &nbsp; <span class="axis-y">Y: <b id="gy">0</b></span> &nbsp; <span class="axis-z">Z: <b id="gz">0</b></span></span>
        <span id="gyroStats" class="text-end"></span>
      </div>
    </div>

    <div class="console-card mt-4">
      <h5>Console Output</h5>
      <div id="consoleBox">[ready]</div>
    </div>
  </div>

<script>

/* ====== CONFIG / STATE ====== */
const CLASSES=["sit","stand","walk","climb up","climb down","run"];
const CLASS_EMOJI = {
  "sit":"🪑", "stand":"🧍", "walk":"🚶", "climb up":"⏫", "climb down":"⏬", "run":"🏃"
};
let session=null, creatingSession=false, currentModel="models/cnnpf_loo_ms_erm.onnx";
let isRunning=false, loopRunning=false;
let buffer=[];
const WINDOW_SEC=3, STEP_SEC=1;
const STEP_INTERVAL=STEP_SEC*1000;
const samplesPerWindow = () => Math.round(WINDOW_SEC * config.rate);
let startTime=null, debugTimer=null;
let lastSampleTs=0; // throttle devicemotion
const INFERENCE_TIMEOUT_MS = 4000;
let inferenceCount = 0;
const HISTORY_LEN = 6;
let predHistory = []; // [{label, emoji, ts}], oldest first
let predLog = [];     // every prediction of the current session: [{timestamp, activity}]
let sessionStart = null, sessionModel = null; // set on Start, used for the CSV file name

/* ====== CONSOLE LOG ====== */
function log(msg, type="info"){
  const box=document.getElementById("consoleBox");
  const time=new Date().toLocaleTimeString();
  const safe=String(msg).replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const color = type==="err" ? "#f55" : type==="ok" ? "#7f7" : "#0f0";
  box.innerHTML += `<span style="color:${color}">[${time}] ${safe}</span><br>`;
  const lines=box.innerHTML.split("<br>"); if(lines.length>600) box.innerHTML=lines.slice(-600).join("<br>");
  box.scrollTop=box.scrollHeight;
  (type==="err"?console.error:console.log)(msg);
}

/* ====== PLOTS ====== */
const accData={x:[],y:[],z:[],t:[]}, gyroData={x:[],y:[],z:[],t:[]};
// Same axis colors for both plots (defined once in CSS :root)
const rootStyle = getComputedStyle(document.documentElement);
const axisTraces = ["x","y","z"].map(a=>({y:[],mode:'lines',name:a.toUpperCase(),line:{color:rootStyle.getPropertyValue(`--axis-${a}`).trim()}}));
const PLOT_HEIGHT = 260;
Plotly.newPlot('accPlot',structuredClone(axisTraces),{height:PLOT_HEIGHT,margin:{t:10,b:40},yaxis:{title:'m/s²'},xaxis:{title:'Time (s)'}});
Plotly.newPlot('gyroPlot',structuredClone(axisTraces),{height:PLOT_HEIGHT,margin:{t:10,b:40},yaxis:{title:'rad/s'},xaxis:{title:'Time (s)'}});

/* ====== OPTIONS (modal) ====== */
const config = { rate:20, gyroUnit:"rads", accType:"linear", debug:false, countdown:0 };
const optionsModal = document.getElementById("optionsModal");

function readOptionsForm(){
  return {
    rate: Math.min(100, Math.max(1, parseFloat(document.getElementById("rateSelect").value)||20)),
    gyroUnit: document.getElementById("gyroUnit").value,
    accType: document.getElementById("accType").value,
    debug: document.getElementById("debugMode").checked,
    countdown: parseInt(document.getElementById("countdownSelect").value)||0,
  };
}
function fillOptionsForm(){
  document.getElementById("rateSelect").value = config.rate;
  document.getElementById("gyroUnit").value = config.gyroUnit;
  document.getElementById("accType").value = config.accType;
  document.getElementById("debugMode").checked = config.debug;
  document.getElementById("countdownSelect").value = config.countdown;
}

// Reset the form to the applied config every time the modal opens (discards cancelled edits)
optionsModal.addEventListener("show.bs.modal", fillOptionsForm);

document.getElementById("applyOptions").addEventListener("click", ()=>{
  const next = readOptionsForm();
  const changes = Object.keys(next).filter(k => next[k] !== config[k]).map(k => `${k}: ${config[k]} → ${next[k]}`);
  Object.assign(config, next);

  const unit = config.gyroUnit==="rads" ? "rad/s" : "°/s";
  document.getElementById("gyroUnitLabel").textContent = unit;
  Plotly.relayout('gyroPlot', {'yaxis.title':unit});

  if(changes.length){
    log(`⚙️ Config applied: ${changes.join(", ")}`, "ok");
    if(isRunning && changes.some(c => c.startsWith("debug") || (config.debug && c.startsWith("rate"))))
      log("⚙️ Stop and Start again to apply the data source/rate change.");
  } else {
    log("⚙️ Config applied: no changes");
  }
  bootstrap.Modal.getInstance(optionsModal).hide();
});

/* ====== MODEL DISCOVERY ====== */
const MODELS_DIR = "models/";

// Normalize a possibly-relative href to a clean path under MODELS_DIR
function joinModelsPath(href) {
  // ignore parent dirs and anchors
  if (!href || href.startsWith("#") || href.startsWith("?")) return null;
  // absolute links: keep if they already point inside models/
  try {
    const u = new URL(href, location.href);
    // Only allow files that live under MODELS_DIR
    const modelsUrl = new URL(MODELS_DIR, location.href);
    if (!u.href.startsWith(modelsUrl.href)) return null;
    // Return path relative to page origin (e.g., "models/foo.onnx")
    return u.pathname.replace(/^\//, "");
  } catch {
    return null;
  }
}

async function discoverModels() {
  // 1) Try directory listing (works on python http.server and many static servers)
  try {
    const listingUrl = new URL(MODELS_DIR, location.href).toString();
    const res = await fetch(listingUrl, { cache: "no-cache" });
    const html = await res.text();
    // parse all href="...onnx"
    const rawMatches = [...html.matchAll(/href="([^"]+\.onnx)"/gi)].map(m => m[1]);
    const normalized = rawMatches
      .map(h => joinModelsPath(new URL(h, listingUrl).href))
      .filter(Boolean);

    const unique = [...new Set(normalized)];
    if (unique.length) return unique;
  } catch (e) {
    console.warn("Directory listing parse failed:", e);
  }

  // 2) Try manifest file (see option 2 below)
  try {
    const res = await fetch(`${MODELS_DIR}manifest.json`, { cache: "no-cache" });
    if (res.ok) {
      const arr = await res.json(); // expects ["models/foo.onnx", ...] or ["foo.onnx", ...]
      const normalized = arr.map(p => p.startsWith(MODELS_DIR) ? p : `${MODELS_DIR}${p}`);
      if (normalized.length) return normalized;
    }
  } catch {}

  // 3) Final fallbacks
  // If you always have a default at models/cnnpf_loo_ms_erm.onnx, list that
  return [`${MODELS_DIR}cnnpf_loo_ms_erm.onnx`];
}

async function populateModelDropdown() {
  const sel = document.getElementById("modelSelect");
  const models = await discoverModels();

  sel.innerHTML = "";
  models.forEach(m => {
    const opt = document.createElement("option");
    opt.value = m;
    opt.textContent = m.replace(/^models\//, "");
    if (m === currentModel) opt.selected = true;
    sel.appendChild(opt);
  });

  // if the current model isn't in the list, use the first
  if (!models.includes(currentModel)) currentModel = models[0];
}

// Tint the model dropdown by load state: "", "loading", "ok" or "error"
function setModelStatus(state, title){
  const el = document.getElementById("modelSelect");
  el.classList.remove("model-ok","model-error");
  if(state==="ok") el.classList.add("model-ok");
  if(state==="error") el.classList.add("model-error");
  el.title = title || state || "not loaded";
}

document.getElementById("modelSelect").addEventListener("change", async (e)=>{
  currentModel = e.target.value;
  log(`Model changed to: ${currentModel}`);
  await createSession(); // now loads fresh bytes (no cache)
});


/* ====== MODEL LOAD / RELOAD ====== */
async function createSession(){
  if (creatingSession) { log("createSession() already in progress"); return; }
  creatingSession = true;
  const modelPath = currentModel; // snapshot in case user switches quickly

  try{
    // show loading
    document.getElementById("predActivity").textContent = "–";
    document.getElementById("predEmoji").textContent = "–";
    setModelStatus("loading", `loading ${modelPath}...`);
    log(`Loading ${modelPath} (WASM, single-thread) ...`);

    // Safe WASM config for sensors
    ort.env.wasm.numThreads = 1;
    ort.env.wasm.simd = true;
    ort.env.wasm.proxy = false;
    ort.env.logLevel = "warning"; // "verbose" if you want deeper logs

    // 💡 Force a fresh fetch (no cache), then create session from bytes
    // Also set session=null to make the loop skip a cycle while we rebuild.
    session = null;
    const resp = await fetch(modelPath, { cache: "no-store" });
    if (!resp.ok) throw new Error(`HTTP ${resp.status} loading ${modelPath}`);
    const bytes = new Uint8Array(await resp.arrayBuffer());

    session = await ort.InferenceSession.create(bytes, { executionProviders: ["wasm"] });

    setModelStatus("ok", `loaded ${modelPath}`);
    log(`Model loaded: ${modelPath}`, "ok");
  } catch (e){
    log("Failed to create session: "+e, "err");
    session = null;
    setModelStatus("error", String(e));
  } finally {
    creatingSession = false;
  }
  // The user picked another model while this one was loading: load the new pick
  if (currentModel !== modelPath) await createSession();
}


/* ====== SENSOR / DEBUG FEED ====== */
function pushSample(ax,ay,az,gx,gy,gz,now){
  buffer.push([ax,ay,az,gx,gy,gz]);
  while(buffer.length>samplesPerWindow()) buffer.shift();

  // live values
  document.getElementById("ax").textContent=ax.toFixed(2);
  document.getElementById("ay").textContent=ay.toFixed(2);
  document.getElementById("az").textContent=az.toFixed(2);
  document.getElementById("gx").textContent=gx.toFixed(2);
  document.getElementById("gy").textContent=gy.toFixed(2);
  document.getElementById("gz").textContent=gz.toFixed(2);

  // plot buffers (keep last 5s)
  accData.x.push(ax); accData.y.push(ay); accData.z.push(az); accData.t.push(now);
  gyroData.x.push(gx); gyroData.y.push(gy); gyroData.z.push(gz); gyroData.t.push(now);
  const maxT = now - 5;
  [accData,gyroData].forEach(d=>{ while(d.t.length && d.t[0] < maxT){ d.t.shift(); d.x.shift(); d.y.shift(); d.z.shift(); }});
  Plotly.update('accPlot',{x:[accData.t,accData.t,accData.t], y:[accData.x,accData.y,accData.z]}, {xaxis:{range:[Math.max(0, now-5), now]}});
  Plotly.update('gyroPlot',{x:[gyroData.t,gyroData.t,gyroData.t], y:[gyroData.x,gyroData.y,gyroData.z]}, {xaxis:{range:[Math.max(0, now-5), now]}});

  // stats
  updateStats(now);
}

function updateStats(now){
  const stats=a=>({min:Math.min(...a).toFixed(2), max:Math.max(...a).toFixed(2), mean:(a.reduce((x,y)=>x+y,0)/a.length).toFixed(2)});
  if(accData.x.length){ const s=stats(accData.x.concat(accData.y,accData.z));
    document.getElementById("accStats").innerHTML=`Mean:${s.mean} Min:${s.min} Max:${s.max}<br>Samples:${accData.t.length} · Time:${now.toFixed(2)} s`; }
  if(gyroData.x.length){ const s=stats(gyroData.x.concat(gyroData.y,gyroData.z));
    document.getElementById("gyroStats").innerHTML=`Mean:${s.mean} Min:${s.min} Max:${s.max}<br>Samples:${gyroData.t.length} · Time:${now.toFixed(2)} s`; }
}

// Throttled real sensor handler
function handleMotion(e){
  if(!isRunning) return;
  const interval = 1000/config.rate;
  const nowTs = performance.now();
  if (nowTs - lastSampleTs < interval) return; // throttle
  // Advance on a fixed schedule instead of snapping to the event time, so that event
  // jitter (e.g. 60 Hz events vs 50 ms slots) doesn't push the real rate below target.
  // Resync if we fell more than one slot behind (first sample, tab paused, slow device).
  lastSampleTs = (nowTs - lastSampleTs > 2*interval) ? nowTs : lastSampleTs + interval;

  if(!startTime) startTime = performance.now();
  const now = (performance.now()-startTime)/1000;

  const accMode=config.accType;
  const gyroMode=config.gyroUnit;
  const acc= accMode==="gravity" ? e.accelerationIncludingGravity : e.acceleration;
  const ax=acc?.x??0, ay=acc?.y??0, az=acc?.z??0;
  let gx=e.rotationRate?.beta??0, gy=e.rotationRate?.gamma??0, gz=e.rotationRate?.alpha??0;
  if(gyroMode==="rads"){ gx*=Math.PI/180; gy*=Math.PI/180; gz*=Math.PI/180; }
  pushSample(ax,ay,az,gx,gy,gz,now);
}

// Debug generator
function startDebugMode(){
  const dt=1000/config.rate; let t0=performance.now();
  debugTimer=setInterval(()=>{
    const now=(performance.now()-t0)/1000;
    const ax=Math.sin(now*2*Math.PI*1.5)+(Math.random()-0.5)*0.2;
    const ay=Math.cos(now*2*Math.PI*1.5)+(Math.random()-0.5)*0.2;
    const az=9.81+(Math.random()-0.5)*0.1;
    const gx=Math.sin(now*2*Math.PI*0.8)*0.05;
    const gy=Math.cos(now*2*Math.PI*0.8)*0.05;
    const gz=(Math.random()-0.5)*0.01;
    pushSample(ax,ay,az,gx,gy,gz,now);
  }, dt);
}
function stopDebugMode(){ if(debugTimer) clearInterval(debugTimer); debugTimer=null; }

/* ====== INFERENCE SAFE RUN + WATCHDOG ====== */
function timeoutPromise(ms){
  return new Promise((_, rej) => setTimeout(()=>rej(new Error(`watchdog timeout after ${ms}ms`)), ms));
}
async function safeRun(tensor){
  return Promise.race([ session.run({ input: tensor }), timeoutPromise(INFERENCE_TIMEOUT_MS) ]);
}

// Always render HISTORY_LEN slots (empty ones padded on the left) so the card never changes size
function renderHistory(){
  const pad = Array(HISTORY_LEN - predHistory.length).fill(null);
  document.getElementById("predHistory").innerHTML = pad.concat(predHistory).map((p,i)=>
    `<div class="slot${p && i===HISTORY_LEN-1 ? " current" : ""}" title="${p ? `${p.label} @ ${p.ts}` : ""}">${p ? p.emoji : ""}</div>`
  ).join("");
}
function pushHistory(label, emoji, ts){
  predHistory.push({label, emoji, ts});
  if(predHistory.length > HISTORY_LEN) predHistory.shift();
  renderHistory();
}

/* ====== PREDICTION LOG / CSV EXPORT ====== */
// Local time as YYYY-MM-DDTHH:MM:SS.mmm (no timezone suffix)
function localIso(d){
  const p=(n,w=2)=>String(n).padStart(w,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(),3)}`;
}

function exportPredictions(){
  if(!predLog.length){ log("Nothing to export yet."); return; }
  const csv = "timestamp,activity\n" + predLog.map(r=>`${r.timestamp},${r.activity}`).join("\n") + "\n";
  const model = sessionModel.replace(/^.*\//, "").replace(/\.onnx$/i, "");
  const name = `${model}_${localIso(sessionStart).slice(0,19).replace(/:/g,"-")}.csv`;
  const url = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  const a = Object.assign(document.createElement("a"), {href:url, download:name});
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  log(`📥 Exported ${predLog.length} predictions to ${name}`, "ok");
}
document.getElementById("exportBtn").addEventListener("click", exportPredictions);

async function performInference(){
  if(!isRunning) return;
  if(!session){ log("⚠️ No session; skipping inference."); return; }
  const effectiveSamples = samplesPerWindow();
  if(buffer.length < effectiveSamples){ return; }

  const arr=buffer.slice(-effectiveSamples);
  // buffer is time-major [T][6]; model expects (B, C, T) = [1, 6, T], so lay out channel-major: data[c*T + t]
  const T=arr.length, data=new Float32Array(6*T);
  for(let t=0;t<T;t++) for(let c=0;c<6;c++) data[c*T+t]=arr[t][c];
  const tensor=new ort.Tensor("float32", data, [1,6,T]); // model expects T=60 @ 20Hz*3s
  const t0=performance.now();
  try{
    document.getElementById("loopStatus").textContent="Loop: running";
    inferenceCount += 1;
//    log(`🧠 [#${inferenceCount}] Running inference... (buffer=${buffer.length})`);
    const out = await safeRun(tensor);
    const latency = performance.now()-t0;
    const logits = out[Object.keys(out)[0]].data;
    const pred = logits.indexOf(Math.max(...logits));
    const label = CLASSES[pred];
    const emoji = CLASS_EMOJI[label] || "🤖";
    const ts = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});

    document.getElementById("predEmoji").textContent = emoji;
    document.getElementById("predActivity").textContent = label;
    document.getElementById("predTime").textContent = ts;
    document.getElementById("predLatency").textContent = latency.toFixed(1) + " ms";
    pushHistory(label, emoji, ts);
    predLog.push({timestamp: localIso(new Date()), activity: label});
    document.getElementById("exportBtn").disabled = false;
    log(`✅ [#${inferenceCount}] Pred=${label} | latency=${latency.toFixed(1)} ms (buffer=${buffer.length})`, "ok");
  } catch(err){
    log(`❌ [#${inferenceCount}] Inference error: ${err}`, "err");
    await rebuildSessionIfNeeded(err);
  } finally {
    document.getElementById("loopStatus").textContent="Loop: idle";
  }
}

async function rebuildSessionIfNeeded(err){
  if(!isRunning) return;
  const msg = String(err||"");
  if (msg.includes("watchdog") || msg.includes("abort") || msg.includes("no available backend")) {
    log("🔁 Recreating session due to watchdog/fatal error...");
    await createSession();
  }
}

/* ====== SEQUENTIAL LOOP (NO setInterval) ====== */
async function startInferenceLoop(){
  if(loopRunning){ log("Loop already running"); return; }
  loopRunning = true;
  log(`⚙️ Starting sequential inference loop every ${STEP_INTERVAL/1000}s`);

  (async function loop(){
    while(isRunning){
      if(!session && !creatingSession){
        log("⚠️ Session missing; attempting to recreate...");
        await createSession();
      }
      await performInference();
      if(!isRunning) break;
      await new Promise(r=>setTimeout(r, STEP_INTERVAL));
    }
    loopRunning = false;
    log("🛑 Inference loop exited.");
  })();
}

/* ====== UI BUTTONS ====== */
// Clear all run state (buffers, plots, readouts, prediction); config is kept
function resetRun(){
  startTime=null; lastSampleTs=0; buffer.length=0; inferenceCount = 0;
  [accData,gyroData].forEach(d=>{ d.x.length=0; d.y.length=0; d.z.length=0; d.t.length=0; });
  ["accPlot","gyroPlot"].forEach(id=>Plotly.update(id,{x:[[],[],[]], y:[[],[],[]]}, {xaxis:{range:[0,5]}}));
  ["ax","ay","az","gx","gy","gz"].forEach(id=>document.getElementById(id).textContent="0");
  ["accStats","gyroStats"].forEach(id=>document.getElementById(id).innerHTML="");
  ["predEmoji","predActivity","predTime","predLatency"].forEach(id=>document.getElementById(id).textContent="–");
  predHistory = []; renderHistory();
  predLog = []; document.getElementById("exportBtn").disabled = true;
}

let starting=false; // guards against double clicks while Start is still loading the model / counting down

/* ====== START COUNTDOWN ====== */
const beeps = { small: new Audio("sounds/small_beep.mp3"), long: new Audio("sounds/long_beep.mp3") };
Object.values(beeps).forEach(a=>a.preload="auto");

function playBeep(a){ a.currentTime=0; a.play().catch(e=>console.warn("beep failed:", e)); }

// Mobile browsers (iOS) only allow audio started from a user gesture: play muted once inside the click
function unlockBeeps(){
  Object.values(beeps).forEach(a=>{ a.muted=true; a.play().then(()=>{ a.pause(); a.currentTime=0; a.muted=false; }).catch(()=>{ a.muted=false; }); });
}

// Show N, N-1, ..., 1 in the Start button, one per second: small beep each second, long beep on the last
async function runCountdown(seconds){
  const btn=document.getElementById("toggleButton");
  for(let s=seconds; s>=1; s--){
    btn.textContent=`⏱ ${s}`;
    playBeep(s===1 ? beeps.long : beeps.small);
    await new Promise(r=>setTimeout(r, 1000));
  }
}

document.getElementById("toggleButton").onclick = async ()=>{
  if(starting) return;
  if(isRunning){
    isRunning=false;
    window.removeEventListener("devicemotion",handleMotion);
    stopDebugMode();
    document.getElementById("toggleButton").textContent="Start";
    document.getElementById("toggleButton").classList.replace("btn-danger","btn-success");
    log("Stopped.");
  } else {
    const debug=config.debug;
    if(config.countdown>0) unlockBeeps();
    // Ask for sensor permission first: iOS requires it directly inside the click gesture
    if(!debug && DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission==="function"){
      // requestPermission() resolves to "denied" (it doesn't throw) when the user refuses
      let perm; try{ perm = await DeviceMotionEvent.requestPermission(); } catch(e){ perm = "denied"; }
      if(perm !== "granted"){ alert("Motion sensor permission denied"); return; }
    }
    starting=true;
    document.getElementById("toggleButton").disabled=true;
    log("🔄 Resetting run state and reloading model...");
    resetRun();
    await createSession();
    // Model is loaded before counting down, so capture begins right after the last beep
    if(config.countdown>0){ log(`⏱ Starting in ${config.countdown} s...`); await runCountdown(config.countdown); }
    starting=false;
    document.getElementById("toggleButton").disabled=false;

    sessionStart = new Date(); sessionModel = currentModel;
    isRunning=true;
    if(debug){
      startDebugMode(); log("Debug mode active.");
    } else {
      window.addEventListener("devicemotion",handleMotion);
      log("Sensor capture started.");
    }
    startInferenceLoop();
    document.getElementById("toggleButton").textContent="Stop";
    document.getElementById("toggleButton").classList.replace("btn-success","btn-danger");
  }
};

/* ====== BOOT ====== */
(async function boot(){
  renderHistory();
  await populateModelDropdown();
  log(`Initial model: ${currentModel}`);
  await createSession(); // pre-load
})();
</script>
