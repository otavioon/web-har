<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebHAR – Live HAR Dashboard (WASM + Watchdog)</title>

  <!-- Plotly -->
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <!-- ONNXRuntime-Web -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- JSZip (Export > Save all) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    body { background:#f5f7fa; font-family:"Inter",sans-serif; padding:1.5rem; }
    .prediction-card,.console-card {
      background:#fff;border-radius:.75rem;box-shadow:0 2px 8px rgba(0,0,0,0.1);padding:1rem;text-align:center;
    }
    .prediction-card{background:#eef7ff;color:#007bff;font-weight:700;font-size:1.5rem;height:10rem;overflow:hidden;padding:.75rem 1rem;cursor:pointer;}
    .prediction-card div{white-space:nowrap;}
    #predHistory{display:flex;justify-content:center;gap:.4rem;margin-top:.5rem;padding-top:.5rem;border-top:1px solid rgba(0,123,255,.15);}
    #predHistory .slot{width:2.6rem;height:3.3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.4rem;line-height:1.1;border-radius:.5rem;background:rgba(0,123,255,.06);opacity:.55;}
    #predHistory .slot small{font-size:.65rem;font-weight:400;color:#555;}
    #predHistory .slot.current{opacity:1;background:rgba(0,123,255,.15);outline:2px solid rgba(0,123,255,.4);}
    #predLabel{font-size:1.4rem;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;}
    #predEmoji{font-size:2rem;vertical-align:middle;}
    .plot-container{background:white;border-radius:.75rem;padding:.6rem .75rem;box-shadow:0 2px 8px rgba(0,0,0,0.1);margin-top:.75rem;}
    .small-text{font-size:.9rem;color:#555;}
    #consoleBox{
      background:#111;color:#0f0;font-family:monospace;font-size:.9rem;
      text-align:left;overflow-y:auto;max-height:260px;padding:.5rem;border-radius:.5rem;
      white-space:pre-wrap; word-wrap:break-word;
    }
    :root { --axis-x:#f4a3a8; --axis-y:#a8d8b9; --axis-z:#a7c7e7; }
    .axis-x,.axis-y,.axis-z{color:#333;border-radius:.35rem;padding:0 .35rem;}
    .axis-x{background:var(--axis-x);} .axis-y{background:var(--axis-y);} .axis-z{background:var(--axis-z);}
    .plot-container h5{margin-bottom:.25rem;}
    .raw-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.25rem 1rem;border-top:1px solid #eee;padding-top:.5rem;}
    #modelSelect.model-ok{background-color:rgba(25,135,84,.18);border-color:rgba(25,135,84,.5);}
    #modelSelect.model-error{background-color:rgba(220,53,69,.18);border-color:rgba(220,53,69,.5);}
  </style>
</head>

<body>
  <div class="container">
    <h1>📱 WebHAR – Real-Time HAR Dashboard</h1>

    <div class="d-flex flex-nowrap align-items-center gap-2 mb-3">
      <button id="toggleButton" class="btn btn-success" style="min-width:5rem">Start</button>
      <select id="modelSelect" class="form-select w-auto" style="min-width:0" title="not loaded">
        <!-- Filled at runtime; falls back to cnnpf_loo_ms_erm.onnx -->
      </select>
      <button class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#optionsModal" title="Options">⚙️</button>
      <div class="dropdown">
        <button id="exportBtn" class="btn btn-outline-secondary" data-bs-toggle="dropdown" aria-expanded="false" title="Export">📥</button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><button id="exportPredBtn" class="dropdown-item" type="button">📋 Predictions</button></li>
          <li><button id="exportSensorBtn" class="dropdown-item" type="button">📈 Sensor data</button></li>
          <li><button id="exportConsoleBtn" class="dropdown-item" type="button">🖥️ Console output</button></li>
          <li><hr class="dropdown-divider"></li>
          <li><button id="exportAllBtn" class="dropdown-item fw-semibold" type="button">📦 Save all (.zip)</button></li>
        </ul>
      </div>
      <button id="clearBtn" class="btn btn-outline-secondary" title="Clear everything (keeps options)">🧹</button>
    </div>

    <!-- Options modal: values are only committed to `config` on Apply -->
    <div class="modal fade" id="optionsModal" tabindex="-1" aria-labelledby="optionsTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="optionsTitle">⚙️ Options</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body d-grid gap-3">
            <div class="input-group">
              <span class="input-group-text">Rate (Hz)</span>
              <input id="rateSelect" type="number" min="1" max="100" value="20" class="form-control" />
            </div>
            <div class="input-group">
              <span class="input-group-text">Gyro</span>
              <select id="gyroUnit" class="form-select"><option value="rads" selected>rad/s</option><option value="degs">°/s</option></select>
            </div>
            <div class="input-group">
              <span class="input-group-text">Accel</span>
              <select id="accType" class="form-select"><option value="linear" selected>Linear</option><option value="gravity">Incl. Gravity</option></select>
            </div>
            <div class="input-group">
              <span class="input-group-text">Countdown</span>
              <select id="countdownSelect" class="form-select"><option value="0" selected>Disabled</option><option value="3">3 s</option><option value="5">5 s</option><option value="10">10 s</option></select>
            </div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="debugMode"><label class="form-check-label" for="debugMode">Debug Data</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="recordSensors"><label class="form-check-label" for="recordSensors">Record sensor data</label></div>
            <div class="d-flex gap-2 border-top pt-3">
              <button type="button" id="saveConfigBtn" class="btn btn-sm btn-outline-secondary" title="Download the values in this form as config.json">💾 Save to file</button>
              <button type="button" id="loadConfigBtn" class="btn btn-sm btn-outline-secondary" title="Fill this form from a config.json (press Apply to keep it)">📂 Load from file</button>
              <input type="file" id="loadConfigFile" accept=".json,application/json" hidden />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" id="restoreDefaults" class="btn btn-link me-auto px-0" title="Fill the form with default values (press Apply to keep them)">Restore defaults</button>
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" id="applyOptions" class="btn btn-primary">Apply</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Predictions table modal: same rows as the CSV, time relative to recording start -->
    <div class="modal fade" id="predTableModal" tabindex="-1" aria-labelledby="predTableTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <div>
              <h5 class="modal-title" id="predTableTitle">📋 Predictions</h5>
              <div id="predTableInfo" class="small-text"></div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-0">
            <table class="table table-sm table-striped mb-0">
              <thead class="sticky-top bg-white"><tr><th>Time (s)</th><th>Activity</th></tr></thead>
              <tbody id="predTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="prediction-card" data-bs-toggle="modal" data-bs-target="#predTableModal" title="Show all predictions">
      <div class="d-flex align-items-center justify-content-between gap-2">
        <div id="predLabel">
          <span id="predEmoji">–</span>
          <span id="predActivity">–</span>
        </div>
        <div class="small-text fw-normal text-end">
          <span id="predTime">–</span> (<span id="predLatency">–</span>)
          <div id="loopStatus">Loop: idle</div>
        </div>
      </div>
      <!-- Last HISTORY_LEN predictions, oldest left, current rightmost -->
      <div id="predHistory"></div>
    </div>

    <div class="plot-container">
      <h5>Accelerometer (<span id="accUnit">m/s²</span>)</h5><div id="accPlot"></div>
      <div class="raw-row small-text">
        <span><span class="axis-x">X: <b id="ax">0</b></span> &nbsp; <span class="axis-y">Y: <b id="ay">0</b></span> &nbsp; <span class="axis-z">Z: <b id="az">0</b></span></span>
        <span id="accStats" class="text-end"></span>
      </div>
    </div>
    <div class="plot-container">
      <h5>Gyroscope (<span id="gyroUnitLabel">rad/s</span>)</h5><div id="gyroPlot"></div>
      <div class="raw-row small-text">
        <span><span class="axis-x">X: <b id="gx">0</b></span> &nbsp; <span class="axis-y">Y: <b id="gy">0</b></span> &nbsp; <span class="axis-z">Z: <b id="gz">0</b></span></span>
        <span id="gyroStats" class="text-end"></span>
      </div>
    </div>

    <div class="console-card mt-4">
      <h5>Console Output</h5>
      <div id="consoleBox">[ready]</div>
    </div>
  </div>

<script>

/* ====== CONFIG / STATE ====== */
const CLASSES=["sit","stand","walk","climb up","climb down","run"];
const CLASS_EMOJI = {
  "sit":"🪑", "stand":"🧍", "walk":"🚶", "climb up":"⏫", "climb down":"⏬", "run":"🏃"
};
let session=null, creatingSession=false, currentModel="models/cnnpf_loo_ms_erm.onnx";
let isRunning=false, loopRunning=false;
let buffer=[];
const WINDOW_SEC=3, STEP_SEC=1;
const STEP_INTERVAL=STEP_SEC*1000;
const samplesPerWindow = () => Math.round(WINDOW_SEC * config.rate);
let startTime=null, debugTimer=null;
let lastSampleTs=0; // throttle devicemotion
const INFERENCE_TIMEOUT_MS = 4000;
let inferenceCount = 0;
const HISTORY_LEN = 6;
let predHistory = []; // [{label, emoji, ts}], oldest first
let predLog = [];     // every row of the current session: [{time: Date, activity}]
let sensorLog = [];   // raw samples of the current session when "Record sensor data" is on: [{time: Date, values: [ax,ay,az,gx,gy,gz]}]
let sessionStart = null, sessionModel = null; // set on Start, used for the CSV file name
let warnedOutputSize = false, warnedNullSensor = false, sampleCount = 0;
let sensorWatchdog = null; // warns if no motion events arrive after Start

/* ====== CONSOLE LOG ====== */
let consoleLines = []; // full plain-text history for export (the on-page box keeps only the last 600)
function log(msg, type="info"){
  const box=document.getElementById("consoleBox");
  const time=new Date().toLocaleTimeString();
  consoleLines.push(`${localIso(new Date())} [${type.toUpperCase()}] ${msg}`);
  const safe=String(msg).replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const color = type==="err" ? "#f55" : type==="warn" ? "#fd5" : type==="ok" ? "#7f7" : "#0f0";
  box.innerHTML += `<span style="color:${color}">[${time}] ${safe}</span><br>`;
  const lines=box.innerHTML.split("<br>"); if(lines.length>600) box.innerHTML=lines.slice(-600).join("<br>");
  box.scrollTop=box.scrollHeight;
  (type==="err"?console.error:type==="warn"?console.warn:console.log)(msg);
}

// Surface anything uncaught in the on-page console too
window.addEventListener("error", e=>log(`Uncaught error: ${e.message} (${(e.filename||"").split("/").pop()}:${e.lineno})`, "err"));
window.addEventListener("unhandledrejection", e=>log(`Unhandled promise rejection: ${e.reason}`, "err"));

// CDN libraries: if one failed to load, say which instead of a cryptic ReferenceError
[["Plotly","Plotly (graphs)"],["ort","ONNX Runtime (inference)"],["bootstrap","Bootstrap JS (options/export menus)"],["JSZip","JSZip (Save all)"]]
  .forEach(([g,name])=>{ if(typeof window[g]==="undefined") log(`${name} failed to load from CDN — check the network connection`, "err"); });
if(!window.isSecureContext) log("Page is not served over HTTPS/localhost: browsers block motion sensors here (use Debug Data or HTTPS)", "warn");

/* ====== PLOTS ====== */
const accData={x:[],y:[],z:[],t:[]}, gyroData={x:[],y:[],z:[],t:[]};
// Same axis colors for both plots (defined once in CSS :root)
const rootStyle = getComputedStyle(document.documentElement);
const axisTraces = ["x","y","z"].map(a=>({y:[],mode:'lines',name:a.toUpperCase(),line:{color:rootStyle.getPropertyValue(`--axis-${a}`).trim()}}));
const PLOT_HEIGHT = 220;
// Horizontal legend centered below the x-axis title
const plotLayout = yTitle => ({height:PLOT_HEIGHT,margin:{t:5,b:60,l:50,r:10},yaxis:{title:yTitle},xaxis:{title:'Time (s)'},
  legend:{orientation:'h',x:0.5,xanchor:'center',y:-0.35,yanchor:'top'}});
Plotly.newPlot('accPlot',structuredClone(axisTraces),plotLayout('m/s²'));
Plotly.newPlot('gyroPlot',structuredClone(axisTraces),plotLayout('rad/s'));

/* ====== OPTIONS (modal) ====== */
const DEFAULT_CONFIG = Object.freeze({ rate:20, gyroUnit:"rads", accType:"linear", debug:false, countdown:0, recordSensors:false });
const config = { ...DEFAULT_CONFIG };
const optionsModal = document.getElementById("optionsModal");

function readOptionsForm(){
  return {
    rate: Math.min(100, Math.max(1, parseFloat(document.getElementById("rateSelect").value)||20)),
    gyroUnit: document.getElementById("gyroUnit").value,
    accType: document.getElementById("accType").value,
    debug: document.getElementById("debugMode").checked,
    countdown: parseInt(document.getElementById("countdownSelect").value)||0,
    recordSensors: document.getElementById("recordSensors").checked,
  };
}
function fillOptionsForm(cfg=config){
  document.getElementById("rateSelect").value = cfg.rate;
  document.getElementById("gyroUnit").value = cfg.gyroUnit;
  document.getElementById("accType").value = cfg.accType;
  document.getElementById("debugMode").checked = cfg.debug;
  document.getElementById("countdownSelect").value = cfg.countdown;
  document.getElementById("recordSensors").checked = cfg.recordSensors;
}

// Reset the form to the applied config every time the modal opens (discards cancelled edits)
optionsModal.addEventListener("show.bs.modal", ()=>fillOptionsForm());
// Only fills the form; like any other edit it takes effect on Apply
document.getElementById("restoreDefaults").addEventListener("click", ()=>fillOptionsForm(DEFAULT_CONFIG));

// Save/load the form values as config.json. Loading only fills the form; Apply commits it.
document.getElementById("saveConfigBtn").addEventListener("click", ()=>{
  downloadFile("config.json", JSON.stringify(readOptionsForm(), null, 2) + "\n", "application/json");
  log("💾 Options saved to config.json", "ok");
});
document.getElementById("loadConfigBtn").addEventListener("click", ()=>document.getElementById("loadConfigFile").click());
document.getElementById("loadConfigFile").addEventListener("change", async e=>{
  const file = e.target.files[0];
  e.target.value = ""; // allow loading the same file again
  if(!file) return;
  try{
    const loaded = JSON.parse(await file.text());
    // Keep only known keys whose type matches the default; anything else falls back to the default
    const cfg = { ...DEFAULT_CONFIG };
    for(const k of Object.keys(DEFAULT_CONFIG)) if(typeof loaded[k] === typeof DEFAULT_CONFIG[k]) cfg[k] = loaded[k];
    fillOptionsForm(cfg);
    // A value that isn't one of a dropdown's options leaves it blank: fall back to the default
    [["gyroUnit","gyroUnit"],["accType","accType"],["countdownSelect","countdown"]].forEach(([id,k])=>{
      const el=document.getElementById(id); if(el.value==="") el.value=DEFAULT_CONFIG[k];
    });
    log(`📂 Options loaded from ${file.name} (press Apply to use them)`, "ok");
  } catch(err){
    log(`Failed to load ${file.name}: ${err}`, "err");
    alert(`Invalid config file: ${err.message}`);
  }
});

document.getElementById("applyOptions").addEventListener("click", ()=>{
  const next = readOptionsForm();
  const changes = Object.keys(next).filter(k => next[k] !== config[k]).map(k => `${k}: ${config[k]} → ${next[k]}`);
  Object.assign(config, next);

  const unit = config.gyroUnit==="rads" ? "rad/s" : "°/s";
  document.getElementById("gyroUnitLabel").textContent = unit;
  Plotly.relayout('gyroPlot', {'yaxis.title':unit});

  if(changes.length){
    log(`⚙️ Config applied: ${changes.join(", ")}`, "ok");
    if(isRunning && changes.some(c => c.startsWith("debug") || (config.debug && c.startsWith("rate"))))
      log("⚙️ Stop and Start again to apply the data source/rate change.");
  } else {
    log("⚙️ Config applied: no changes");
  }
  bootstrap.Modal.getInstance(optionsModal).hide();
});

/* ====== MODEL DISCOVERY ====== */
const MODELS_DIR = "models/";

// Normalize a possibly-relative href to a clean path under MODELS_DIR
function joinModelsPath(href) {
  // ignore parent dirs and anchors
  if (!href || href.startsWith("#") || href.startsWith("?")) return null;
  // absolute links: keep if they already point inside models/
  try {
    const u = new URL(href, location.href);
    // Only allow files that live under MODELS_DIR
    const modelsUrl = new URL(MODELS_DIR, location.href);
    if (!u.href.startsWith(modelsUrl.href)) return null;
    // Return path relative to page origin (e.g., "models/foo.onnx")
    return u.pathname.replace(/^\//, "");
  } catch {
    return null;
  }
}

async function discoverModels() {
  // 1) Try directory listing (works on python http.server and many static servers)
  try {
    const listingUrl = new URL(MODELS_DIR, location.href).toString();
    const res = await fetch(listingUrl, { cache: "no-cache" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const html = await res.text();
    // parse all href="...onnx"
    const rawMatches = [...html.matchAll(/href="([^"]+\.onnx)"/gi)].map(m => m[1]);
    const normalized = rawMatches
      .map(h => joinModelsPath(new URL(h, listingUrl).href))
      .filter(Boolean);

    const unique = [...new Set(normalized)];
    if (unique.length){ log(`Found ${unique.length} model(s) in ${MODELS_DIR} directory listing`); return unique; }
    log(`No .onnx files in ${MODELS_DIR} directory listing`, "warn");
  } catch (e) {
    log(`${MODELS_DIR} directory listing unavailable (${e.message}); trying manifest.json`, "warn");
  }

  // 2) Try manifest file (see option 2 below)
  try {
    const res = await fetch(`${MODELS_DIR}manifest.json`, { cache: "no-cache" });
    if (res.ok) {
      const arr = await res.json(); // expects ["models/foo.onnx", ...] or ["foo.onnx", ...]
      const normalized = arr.map(p => p.startsWith(MODELS_DIR) ? p : `${MODELS_DIR}${p}`);
      if (normalized.length){ log(`Found ${normalized.length} model(s) in ${MODELS_DIR}manifest.json`); return normalized; }
    }
  } catch (e) {
    log(`Invalid ${MODELS_DIR}manifest.json: ${e.message}`, "warn");
  }

  // 3) Final fallbacks
  // If you always have a default at models/cnnpf_loo_ms_erm.onnx, list that
  log(`Model discovery failed; falling back to ${MODELS_DIR}cnnpf_loo_ms_erm.onnx`, "warn");
  return [`${MODELS_DIR}cnnpf_loo_ms_erm.onnx`];
}

async function populateModelDropdown() {
  const sel = document.getElementById("modelSelect");
  const models = await discoverModels();

  sel.innerHTML = "";
  models.forEach(m => {
    const opt = document.createElement("option");
    opt.value = m;
    opt.textContent = m.replace(/^models\//, "");
    if (m === currentModel) opt.selected = true;
    sel.appendChild(opt);
  });

  // if the current model isn't in the list, use the first
  if (!models.includes(currentModel)) currentModel = models[0];
}

// Tint the model dropdown by load state: "", "loading", "ok" or "error"
function setModelStatus(state, title){
  const el = document.getElementById("modelSelect");
  el.classList.remove("model-ok","model-error");
  if(state==="ok") el.classList.add("model-ok");
  if(state==="error") el.classList.add("model-error");
  el.title = title || state || "not loaded";
}

document.getElementById("modelSelect").addEventListener("change", async (e)=>{
  currentModel = e.target.value;
  log(`Model changed to: ${currentModel}`);
  await createSession(); // now loads fresh bytes (no cache)
});


/* ====== MODEL LOAD / RELOAD ====== */
async function createSession(){
  if (creatingSession) { log("createSession() already in progress"); return; }
  creatingSession = true;
  const modelPath = currentModel; // snapshot in case user switches quickly

  try{
    // show loading
    document.getElementById("predActivity").textContent = "–";
    document.getElementById("predEmoji").textContent = "–";
    setModelStatus("loading", `loading ${modelPath}...`);
    log(`Loading ${modelPath} (WASM, single-thread) ...`);

    // Safe WASM config for sensors
    ort.env.wasm.numThreads = 1;
    ort.env.wasm.simd = true;
    ort.env.wasm.proxy = false;
    ort.env.logLevel = "warning"; // "verbose" if you want deeper logs

    // 💡 Force a fresh fetch (no cache), then create session from bytes
    // Also set session=null to make the loop skip a cycle while we rebuild.
    session = null;
    const tLoad = performance.now();
    const resp = await fetch(modelPath, { cache: "no-store" });
    if (!resp.ok) throw new Error(`HTTP ${resp.status} loading ${modelPath}`);
    const bytes = new Uint8Array(await resp.arrayBuffer());

    session = await ort.InferenceSession.create(bytes, { executionProviders: ["wasm"] });

    setModelStatus("ok", `loaded ${modelPath}`);
    log(`Model loaded: ${modelPath} (${(bytes.length/1024).toFixed(0)} KB, ${(performance.now()-tLoad).toFixed(0)} ms) · inputs=[${session.inputNames}] outputs=[${session.outputNames}]`, "ok");
    if (!session.inputNames.includes("input"))
      log(`Model has no input named "input"; feeding its first input "${session.inputNames[0]}" instead`, "warn");
  } catch (e){
    log("Failed to create session: "+e, "err");
    session = null;
    setModelStatus("error", String(e));
  } finally {
    creatingSession = false;
  }
  // The user picked another model while this one was loading: load the new pick
  if (currentModel !== modelPath) await createSession();
}


/* ====== SENSOR / DEBUG FEED ====== */
function pushSample(ax,ay,az,gx,gy,gz,now){
  sampleCount++;
  buffer.push([ax,ay,az,gx,gy,gz]);
  if(config.recordSensors) sensorLog.push({time: new Date(), values: [ax,ay,az,gx,gy,gz]});
  while(buffer.length>samplesPerWindow()) buffer.shift();

  // live values
  document.getElementById("ax").textContent=ax.toFixed(2);
  document.getElementById("ay").textContent=ay.toFixed(2);
  document.getElementById("az").textContent=az.toFixed(2);
  document.getElementById("gx").textContent=gx.toFixed(2);
  document.getElementById("gy").textContent=gy.toFixed(2);
  document.getElementById("gz").textContent=gz.toFixed(2);

  // plot buffers (keep last 5s)
  accData.x.push(ax); accData.y.push(ay); accData.z.push(az); accData.t.push(now);
  gyroData.x.push(gx); gyroData.y.push(gy); gyroData.z.push(gz); gyroData.t.push(now);
  const maxT = now - 5;
  [accData,gyroData].forEach(d=>{ while(d.t.length && d.t[0] < maxT){ d.t.shift(); d.x.shift(); d.y.shift(); d.z.shift(); }});
  Plotly.update('accPlot',{x:[accData.t,accData.t,accData.t], y:[accData.x,accData.y,accData.z]}, {xaxis:{range:[Math.max(0, now-5), now]}});
  Plotly.update('gyroPlot',{x:[gyroData.t,gyroData.t,gyroData.t], y:[gyroData.x,gyroData.y,gyroData.z]}, {xaxis:{range:[Math.max(0, now-5), now]}});

  // stats
  updateStats(now);
}

function updateStats(now){
  document.getElementById("accStats").textContent=`Samples:${accData.t.length} · Time:${now.toFixed(2)} s`;
  document.getElementById("gyroStats").textContent=`Samples:${gyroData.t.length} · Time:${now.toFixed(2)} s`;
}

// Throttled real sensor handler
function handleMotion(e){
  if(!isRunning) return;
  const interval = 1000/config.rate;
  const nowTs = performance.now();
  if (nowTs - lastSampleTs < interval) return; // throttle
  // Advance on a fixed schedule instead of snapping to the event time, so that event
  // jitter (e.g. 60 Hz events vs 50 ms slots) doesn't push the real rate below target.
  // Resync if we fell more than one slot behind (first sample, tab paused, slow device).
  lastSampleTs = (nowTs - lastSampleTs > 2*interval) ? nowTs : lastSampleTs + interval;

  if(!startTime) startTime = performance.now();
  const now = (performance.now()-startTime)/1000;

  const accMode=config.accType;
  const gyroMode=config.gyroUnit;
  const acc= accMode==="gravity" ? e.accelerationIncludingGravity : e.acceleration;
  if(!warnedNullSensor && (acc?.x==null || e.rotationRate?.alpha==null)){
    warnedNullSensor = true;
    log(`Device reports no ${acc?.x==null ? `${accMode} acceleration` : "gyroscope"} data; using 0 for missing values${acc?.x==null && accMode==="linear" ? " (try Accel: Incl. Gravity)" : ""}`, "warn");
  }
  const ax=acc?.x??0, ay=acc?.y??0, az=acc?.z??0;
  let gx=e.rotationRate?.beta??0, gy=e.rotationRate?.gamma??0, gz=e.rotationRate?.alpha??0;
  if(gyroMode==="rads"){ gx*=Math.PI/180; gy*=Math.PI/180; gz*=Math.PI/180; }
  pushSample(ax,ay,az,gx,gy,gz,now);
}

// Debug generator
function startDebugMode(){
  const dt=1000/config.rate; let t0=performance.now();
  debugTimer=setInterval(()=>{
    const now=(performance.now()-t0)/1000;
    const ax=Math.sin(now*2*Math.PI*1.5)+(Math.random()-0.5)*0.2;
    const ay=Math.cos(now*2*Math.PI*1.5)+(Math.random()-0.5)*0.2;
    const az=9.81+(Math.random()-0.5)*0.1;
    const gx=Math.sin(now*2*Math.PI*0.8)*0.05;
    const gy=Math.cos(now*2*Math.PI*0.8)*0.05;
    const gz=(Math.random()-0.5)*0.01;
    pushSample(ax,ay,az,gx,gy,gz,now);
  }, dt);
}
function stopDebugMode(){ if(debugTimer) clearInterval(debugTimer); debugTimer=null; }

/* ====== INFERENCE SAFE RUN + WATCHDOG ====== */
function timeoutPromise(ms){
  return new Promise((_, rej) => setTimeout(()=>rej(new Error(`watchdog timeout after ${ms}ms`)), ms));
}
async function safeRun(tensor){
  const inputName = session.inputNames.includes("input") ? "input" : session.inputNames[0];
  return Promise.race([ session.run({ [inputName]: tensor }), timeoutPromise(INFERENCE_TIMEOUT_MS) ]);
}

// Always render HISTORY_LEN slots (empty ones padded on the left) so the card never changes size
function renderHistory(){
  const pad = Array(HISTORY_LEN - predHistory.length).fill(null);
  document.getElementById("predHistory").innerHTML = pad.concat(predHistory).map((p,i)=>
    `<div class="slot${p && i===HISTORY_LEN-1 ? " current" : ""}" title="${p ? `${p.label} @ ${p.ts}` : ""}">${p ? `${p.emoji}<small>${p.rel}s</small>` : ""}</div>`
  ).join("");
}
function pushHistory(label, emoji, ts){
  const rel = Math.round((Date.now() - sessionStart) / 1000); // seconds since recording start
  predHistory.push({label, emoji, ts, rel});
  if(predHistory.length > HISTORY_LEN) predHistory.shift();
  renderHistory();
}

/* ====== PREDICTION LOG / CSV EXPORT ====== */
// Local time as YYYY-MM-DDTHH:MM:SS.mmm (no timezone suffix)
function localIso(d){
  const p=(n,w=2)=>String(n).padStart(w,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(),3)}`;
}

// Add a row to the session log (CSV + table). activity is a class label, RECORD_START, RECORD_STOP or COOLDOWN.
const RECORD_START="RECORD START", RECORD_STOP="RECORD STOP", COOLDOWN="COOLDOWN";
function logPrediction(activity){
  predLog.push({time: new Date(), activity});
  if(predTableModal.classList.contains("show")) renderPredTable();
}

// data: string or Blob
function downloadFile(name, data, type){
  const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], {type}));
  const a = Object.assign(document.createElement("a"), {href:url, download:name});
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// <model>_<session start>, e.g. cnnpf_loo_ms_erm_2026-11-02T14-30-05 (webhar_<now> before any recording)
function exportBaseName(){
  const stamp = d => localIso(d).slice(0,19).replace(/:/g,"-");
  if(!sessionStart) return `webhar_${stamp(new Date())}`;
  const model = sessionModel.replace(/^.*\//, "").replace(/\.onnx$/i, "");
  return `${model}_${stamp(sessionStart)}`;
}

const predictionsCsv = () => "timestamp,activity\n" + predLog.map(r=>`${localIso(r.time)},${r.activity}`).join("\n") + "\n";
const sensorsCsv = () => "TimeStamp,accel-x,accel-y,accel-z,gyro-x,gyro-y,gyro-z\n"
  + sensorLog.map(r=>`${localIso(r.time)},${r.values.join(",")}`).join("\n") + "\n";
const consoleText = () => consoleLines.join("\n") + "\n";
const configJson = () => JSON.stringify(config, null, 2) + "\n"; // the applied config

function exportPredictions(){
  if(!predLog.length){ log("Nothing to export yet."); return; }
  const name = `${exportBaseName()}.csv`;
  downloadFile(name, predictionsCsv(), "text/csv");
  log(`📥 Exported ${predLog.length} rows to ${name}`, "ok");
}

function exportSensors(){
  if(!sensorLog.length){ log("No sensor data recorded (enable \"Record sensor data\" in options)."); return; }
  const name = `${exportBaseName()}_sensors.csv`;
  downloadFile(name, sensorsCsv(), "text/csv");
  log(`📥 Exported ${sensorLog.length} sensor samples to ${name}`, "ok");
}

function exportConsole(){
  const name = `${exportBaseName()}_console.txt`;
  log(`📥 Exported ${consoleLines.length + 1} console lines to ${name}`, "ok"); // logged first so it's in the file
  downloadFile(name, consoleText(), "text/plain");
}

// One zip with config.json, predictions, sensor data (if any) and the console output
async function exportAll(){
  if(typeof JSZip==="undefined"){ log("JSZip failed to load from CDN; cannot create zip", "err"); return; }
  const base = exportBaseName(), zip = new JSZip();
  const files = ["config.json"];
  zip.file("config.json", configJson());
  if(predLog.length){ zip.file(`${base}.csv`, predictionsCsv()); files.push(`${base}.csv`); }
  if(sensorLog.length){ zip.file(`${base}_sensors.csv`, sensorsCsv()); files.push(`${base}_sensors.csv`); }
  files.push(`${base}_console.txt`);
  log(`📦 Exporting ${base}.zip: ${files.join(", ")}`, "ok"); // logged first so it's in the zipped console
  zip.file(`${base}_console.txt`, consoleText());
  try{
    downloadFile(`${base}.zip`, await zip.generateAsync({type:"blob", compression:"DEFLATE"}));
  } catch(err){
    log(`Failed to create ${base}.zip: ${err}`, "err");
  }
}

document.getElementById("exportPredBtn").addEventListener("click", exportPredictions);
document.getElementById("exportSensorBtn").addEventListener("click", exportSensors);
document.getElementById("exportConsoleBtn").addEventListener("click", exportConsole);
document.getElementById("exportAllBtn").addEventListener("click", exportAll);
// Show row counts and disable empty choices each time the export menu opens
document.getElementById("exportBtn").addEventListener("show.bs.dropdown", ()=>{
  const pred=document.getElementById("exportPredBtn"), sens=document.getElementById("exportSensorBtn");
  pred.textContent = `📋 Predictions (${predLog.length} rows)`;
  sens.textContent = `📈 Sensor data (${sensorLog.length} samples)`;
  document.getElementById("exportConsoleBtn").textContent = `🖥️ Console output (${consoleLines.length} lines)`;
  pred.classList.toggle("disabled", !predLog.length);
  sens.classList.toggle("disabled", !sensorLog.length);
});

// Same rows as the CSV, but time is relative to the recording start (s.mmm)
const predTableModal = document.getElementById("predTableModal");
function renderPredTable(){
  document.getElementById("predTableInfo").textContent = sessionStart
    ? `Recording started: ${localIso(sessionStart)} · Model: ${sessionModel.replace(/^.*\//, "")}`
    : "No recording yet.";
  document.getElementById("predTableBody").innerHTML = predLog.map(r=>{
    const cls = r.activity===COOLDOWN ? "text-muted" : (r.activity===RECORD_START || r.activity===RECORD_STOP) ? "fw-bold" : "";
    return `<tr class="${cls}"><td>${((r.time - sessionStart)/1000).toFixed(3)}</td><td>${CLASS_EMOJI[r.activity]||""} ${r.activity}</td></tr>`;
  }).join("");
}
predTableModal.addEventListener("show.bs.modal", renderPredTable);

async function performInference(){
  if(!isRunning) return;
  if(!session){ log("⚠️ No session; skipping inference."); return; }
  const effectiveSamples = samplesPerWindow();
  if(buffer.length < effectiveSamples){ logPrediction(COOLDOWN); return; } // window still filling

  const arr=buffer.slice(-effectiveSamples);
  // buffer is time-major [T][6]; model expects (B, C, T) = [1, 6, T], so lay out channel-major: data[c*T + t]
  const T=arr.length, data=new Float32Array(6*T);
  for(let t=0;t<T;t++) for(let c=0;c<6;c++) data[c*T+t]=arr[t][c];
  const tensor=new ort.Tensor("float32", data, [1,6,T]); // model expects T=60 @ 20Hz*3s
  const t0=performance.now();
  try{
    document.getElementById("loopStatus").textContent="Loop: running";
    inferenceCount += 1;
//    log(`🧠 [#${inferenceCount}] Running inference... (buffer=${buffer.length})`);
    const out = await safeRun(tensor);
    if(!isRunning) return; // stopped while inferring: don't log a row after RECORD STOP
    const latency = performance.now()-t0;
    const logits = out[Object.keys(out)[0]].data;
    if(logits.length !== CLASSES.length && !warnedOutputSize){
      warnedOutputSize = true;
      log(`Model outputs ${logits.length} values but ${CLASSES.length} classes are defined (${CLASSES.join(", ")}): labels may be wrong`, "warn");
    }
    const pred = logits.indexOf(Math.max(...logits));
    const label = CLASSES[pred];
    const emoji = CLASS_EMOJI[label] || "🤖";
    const ts = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});

    document.getElementById("predEmoji").textContent = emoji;
    document.getElementById("predActivity").textContent = label;
    document.getElementById("predTime").textContent = ts;
    document.getElementById("predLatency").textContent = latency.toFixed(1) + " ms";
    pushHistory(label, emoji, ts);
    logPrediction(label);
    log(`✅ [#${inferenceCount}] Pred=${label} | latency=${latency.toFixed(1)} ms (buffer=${buffer.length})`, "ok");
  } catch(err){
    log(`❌ [#${inferenceCount}] Inference error (input shape [1,6,${T}]): ${err}`, "err");
    await rebuildSessionIfNeeded(err);
  } finally {
    document.getElementById("loopStatus").textContent="Loop: idle";
  }
}

async function rebuildSessionIfNeeded(err){
  if(!isRunning) return;
  const msg = String(err||"");
  if (msg.includes("watchdog") || msg.includes("abort") || msg.includes("no available backend")) {
    log("🔁 Recreating session due to watchdog/fatal error...");
    await createSession();
  }
}

/* ====== SEQUENTIAL LOOP (NO setInterval) ====== */
async function startInferenceLoop(){
  if(loopRunning){ log("Loop already running"); return; }
  loopRunning = true;
  log(`⚙️ Starting sequential inference loop every ${STEP_INTERVAL/1000}s`);

  (async function loop(){
    while(isRunning){
      if(!session && !creatingSession){
        log("⚠️ Session missing; attempting to recreate...");
        await createSession();
      }
      await performInference();
      if(!isRunning) break;
      await new Promise(r=>setTimeout(r, STEP_INTERVAL));
    }
    loopRunning = false;
    log("🛑 Inference loop exited.");
  })();
}

/* ====== UI BUTTONS ====== */
// Clear all run state (buffers, plots, readouts, prediction); config is kept
function resetRun(){
  startTime=null; lastSampleTs=0; buffer.length=0; inferenceCount = 0;
  [accData,gyroData].forEach(d=>{ d.x.length=0; d.y.length=0; d.z.length=0; d.t.length=0; });
  ["accPlot","gyroPlot"].forEach(id=>Plotly.update(id,{x:[[],[],[]], y:[[],[],[]]}, {xaxis:{range:[0,5]}}));
  ["ax","ay","az","gx","gy","gz"].forEach(id=>document.getElementById(id).textContent="0");
  ["accStats","gyroStats"].forEach(id=>document.getElementById(id).innerHTML="");
  ["predEmoji","predActivity","predTime","predLatency"].forEach(id=>document.getElementById(id).textContent="–");
  predHistory = []; renderHistory();
  predLog = []; sensorLog = [];
}

function stopRun(){
  isRunning=false;
  window.removeEventListener("devicemotion",handleMotion);
  stopDebugMode();
  clearTimeout(sensorWatchdog);
  document.getElementById("toggleButton").textContent="Start";
  document.getElementById("toggleButton").classList.replace("btn-danger","btn-success");
  if(sessionStart) logPrediction(RECORD_STOP);
  log("Stopped.");
  if(sessionStart){
    const secs = (Date.now()-sessionStart)/1000;
    const preds = predLog.filter(r=>CLASSES.includes(r.activity)).length;
    log(`Session summary: ${secs.toFixed(1)} s, ${sampleCount} samples (avg ${(sampleCount/secs).toFixed(1)} Hz, target ${config.rate} Hz), ${preds} predictions${config.recordSensors ? `, ${sensorLog.length} sensor samples recorded` : ""}`);
  }
}

// Mobile browsers pause sensors/timers when the screen locks or the tab is hidden
document.addEventListener("visibilitychange", ()=>{
  if(!isRunning) return;
  if(document.hidden) log("Page hidden (screen locked / tab switched): sensor data and inference may pause", "warn");
  else log("Page visible again");
});

// 🧹 Like reloading the page, but keeps the options and the loaded model
document.getElementById("clearBtn").addEventListener("click", ()=>{
  if(starting) return;
  if((predLog.length || sensorLog.length) && !confirm(`Discard ${predLog.length} prediction rows and ${sensorLog.length} sensor samples that may not have been exported?`)) return;
  if(isRunning) stopRun();
  resetRun();
  sessionStart = null; sessionModel = null;
  document.getElementById("loopStatus").textContent = "Loop: idle";
  document.getElementById("consoleBox").innerHTML = ""; consoleLines = [];
  log("🧹 Cleared.");
});

let starting=false; // guards against double clicks while Start is still loading the model / counting down

/* ====== START COUNTDOWN ====== */
const beeps = { small: new Audio("sounds/small_beep.mp3"), long: new Audio("sounds/long_beep.mp3") };
Object.values(beeps).forEach(a=>a.preload="auto");

Object.entries(beeps).forEach(([k,a])=>a.addEventListener("error", ()=>log(`Could not load ${a.src.split("/").slice(-2).join("/")} (${k} beep)`, "warn")));

function playBeep(a){ a.currentTime=0; a.play().catch(e=>log(`Beep failed to play: ${e.message}`, "warn")); }

// Mobile browsers (iOS) only allow audio started from a user gesture: play muted once inside the click
function unlockBeeps(){
  Object.values(beeps).forEach(a=>{ a.muted=true; a.play().then(()=>{ a.pause(); a.currentTime=0; a.muted=false; }).catch(()=>{ a.muted=false; }); });
}

// Show N, N-1, ..., 1 in the Start button, one per second: small beep each second, long beep on the last
async function runCountdown(seconds){
  const btn=document.getElementById("toggleButton");
  for(let s=seconds; s>=1; s--){
    btn.textContent=`⏱ ${s}`;
    playBeep(s===1 ? beeps.long : beeps.small);
    await new Promise(r=>setTimeout(r, 1000));
  }
}

document.getElementById("toggleButton").onclick = async ()=>{
  if(starting) return;
  if(isRunning){
    stopRun();
  } else {
    const debug=config.debug;
    if(config.countdown>0) unlockBeeps();
    // Ask for sensor permission first: iOS requires it directly inside the click gesture
    if(!debug && typeof DeviceMotionEvent==="undefined"){
      log("This browser has no motion sensor API (DeviceMotionEvent); enable Debug Data in options to test", "err");
      return;
    }
    if(!debug && typeof DeviceMotionEvent.requestPermission==="function"){
      // requestPermission() resolves to "denied" (it doesn't throw) when the user refuses
      let perm; try{ perm = await DeviceMotionEvent.requestPermission(); } catch(e){ perm = "denied"; log(`Motion permission request failed: ${e.message}`, "err"); }
      if(perm !== "granted"){ log(`Motion sensor permission: ${perm}`, "err"); alert("Motion sensor permission denied"); return; }
    }
    starting=true;
    document.getElementById("toggleButton").disabled=true;
    log("🔄 Resetting run state and reloading model...");
    resetRun();
    await createSession();
    // Model is loaded before counting down, so capture begins right after the last beep
    if(config.countdown>0){ log(`⏱ Starting in ${config.countdown} s...`); await runCountdown(config.countdown); }
    starting=false;
    document.getElementById("toggleButton").disabled=false;

    if(!session){ log("Starting without a loaded model: inference is skipped until it loads (see the error above)", "warn"); }
    if(samplesPerWindow() !== 60)
      log(`Rate ${config.rate} Hz gives ${samplesPerWindow()} samples per ${WINDOW_SEC} s window; the model expects 60 (20 Hz) and will likely fail`, "warn");

    sessionStart = new Date(); sessionModel = currentModel;
    sampleCount = 0; warnedOutputSize = false; warnedNullSensor = false;
    logPrediction(RECORD_START);
    log(`Recording started: model=${sessionModel.replace(/^.*\//, "")}, rate=${config.rate} Hz, accel=${config.accType}, gyro=${config.gyroUnit}, source=${debug ? "debug" : "sensors"}, recordSensors=${config.recordSensors}`);
    isRunning=true;
    if(debug){
      startDebugMode(); log("Debug mode active.");
    } else {
      window.addEventListener("devicemotion",handleMotion);
      log("Sensor capture started.");
      // devicemotion never fires on desktops / without permission: say so instead of waiting silently
      sensorWatchdog = setTimeout(()=>{
        if(isRunning && sampleCount===0)
          log("No motion sensor data after 3 s: device may lack sensors, or the page needs HTTPS/permission (use Debug Data to test)", "err");
      }, 3000);
    }
    startInferenceLoop();
    document.getElementById("toggleButton").textContent="Stop";
    document.getElementById("toggleButton").classList.replace("btn-success","btn-danger");
  }
};

/* ====== BOOT ====== */
(async function boot(){
  renderHistory();
  await populateModelDropdown();
  log(`Initial model: ${currentModel}`);
  await createSession(); // pre-load
})();
</script>
